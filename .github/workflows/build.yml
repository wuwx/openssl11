name: Build CentOS 6 RPM & push to PackageCloud

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  PACKAGECLOUD_REPO: ${{ vars.PACKAGECLOUD_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download src.rpm
        run: |
          curl -fSL --retry 3 -o openssl11.src.rpm \
            https://dl.fedoraproject.org/pub/archive/epel/7/SRPMS/Packages/o/openssl11-1.1.1k-7.el7.src.rpm
          file openssl11.src.rpm | grep -q RPM

      - name: Build RPM in centos:6
        run: |
          docker run --rm -i -v "$PWD:/ws" -w /ws centos:6 bash -euo pipefail -s <<'EOS'
          sed -i -e 's/^mirrorlist=/#mirrorlist=/' \
                 -e 's|^#baseurl=http://mirror.centos.org/centos/\$releasever|baseurl=http://vault.centos.org/6.10|' \
                 /etc/yum.repos.d/CentOS-Base.repo
          grep -q 'vault.centos.org/6.10' /etc/yum.repos.d/CentOS-Base.repo

          yum install -y epel-release yum-utils rpm-build

          # EPEL 6 提供 spec 里的 perl-interpreter；它已归档，且 yum-builddep 会启用 -source 源
          sed -i -e 's/^mirrorlist=/#mirrorlist=/' \
                 -e 's|^#baseurl=http://download.fedoraproject.org/pub/epel/|baseurl=https://archives.fedoraproject.org/pub/archive/epel/|' \
                 /etc/yum.repos.d/epel*.repo
          for f in /etc/yum.repos.d/epel*.repo; do grep -q 'archives.fedoraproject.org' "$f"; done

          rpm -ivh /ws/openssl11.src.rpm
          cp /ws/openssl11.spec ~/rpmbuild/SPECS/

          yum-builddep -y ~/rpmbuild/SPECS/openssl11.spec

          # el6 的 rpmbuild（4.8）没有 --nocheck 选项
          rpmbuild -ba ~/rpmbuild/SPECS/openssl11.spec

          mkdir -p /ws/dist
          cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.src.rpm /ws/dist/
          EOS

      - name: Push to PackageCloud
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          sudo gem install package_cloud

          # --skip-duplicates 与当前 API 的报错文本对不上（它要求值恰好是 "has already been taken"）
          for f in dist/*.rpm; do
            out=$(package_cloud push "$PACKAGECLOUD_REPO/el/6" "$f" 2>&1) && { echo "pushed $f"; continue; }
            grep -q 'already been taken' <<<"$out" || { echo "$out"; exit 1; }
            echo "skip (already exists): $f"
          done
